name: Build & Upload to TestFlight

on:
  workflow_dispatch: # 手動で「Run workflow」ボタンを押していつでも実行可能

jobs:
  build:
    name: Build iOS Native App and Upload to TestFlight
    runs-on: macos-26 # Xcode 16 & iOS 18 SDK (Apple最新要件対応)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Setup App Store Connect Private Key for Xcode
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          node -e '
            const fs = require("fs");
            const keyId = (process.env.KEY_ID || "").trim();
            let content = (process.env.KEY_CONTENT || "").trim();
            content = content.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
            if (!content.endsWith("\n")) content += "\n";
            fs.writeFileSync(process.env.HOME + "/.appstoreconnect/private_keys/AuthKey_" + keyId + ".p8", content, "utf8");
          '
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_"$(echo "${KEY_ID}" | tr -d '[:space:]')".p8"

      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Build & Upload to TestFlight via Fastlane
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          cd ios/App
          fastlane beta

      - name: Show gym build log on failure
        if: failure()
        run: |
          cat ~/Library/Logs/gym/App-App.log || true

